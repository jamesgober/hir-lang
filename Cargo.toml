# =============================================================================
#  R E P S   ·   hir-lang
# =============================================================================
[package]
name    = "hir-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "High-level IR for LexerSketch: the structured, typed-optional core every forged language lowers into."

# Keywords (5 max)
keywords = ["hir", "ir", "compiler", "language", "lexersketch"]

# Categories
categories = ["compilers", "development-tools", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/hir-lang"
repository    = "https://github.com/jamesgober/hir-lang"
documentation = "https://docs.rs/hir-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "hir_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["span-lang/std", "intern-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# Origins: every node records a `Span` in the session's global byte space. 0.4 is
# the version syntax-lang and diag-lang use, so spans pass between them unchanged.
span-lang = { version = "0.4", default-features = false }
# Names: identifiers are interned `Symbol`s (4 bytes, integer compare), shared with
# macro-lang, so hygiene marks and names line up across the front end.
intern-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
